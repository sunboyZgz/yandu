name: Native storage contract
on:
  workflow_dispatch:
  pull_request:
    paths: ['internal/storage/**', 'internal/platform/**', 'internal/inventory/**', 'internal/toolchain/**', 'internal/adapters/**', 'internal/cloud/**', 'internal/model/**', 'internal/secrets/**', 'internal/localapi/**', 'cmd/yandu/**', 'cmd/yandu-cloud/**', 'media/**', 'scripts/*cloud*', 'scripts/*storage*', 'scripts/dev.py', 'scripts/build-native-codecs.py', 'release/*storage*', 'release/locks.go', 'release/prepare-native-components.py', 'tests/fixtures/**', 'schemas/**', 'scripts/check-*', 'web/**']
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build macOS codecs from locked sources
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config
          python3 scripts/build-native-codecs.py
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Prepare platform tools
        run: python release/prepare-native-components.py
      - name: Contract and media verification
        shell: pwsh
        run: |
          $suffix=if($IsWindows){'.exe'}else{''}
          $env:PATH="$PWD/.local/native-components/bin"+[IO.Path]::PathSeparator+$env:PATH
          $env:YANDU_TEST_SFTPGO="$PWD/.local/native-components/bin/sftpgo$suffix"
          $env:YANDU_TEST_SFTPGO_TEMPLATES="$PWD/.local/native-components/share/sftpgo/templates"
          $env:YANDU_TEST_MEDIA='1'
          npm --prefix media ci
          node scripts/check-media.mjs
          if($LASTEXITCODE -ne 0){throw 'Native media validation failed'}
          node scripts/check-mp4-constraints.mjs
          if($LASTEXITCODE -ne 0){throw 'Native media validation failed'}
          if($IsWindows){go test ./internal/toolchain ./internal/storage ./internal/platform ./internal/cloud ./internal/reconcile ./cmd/yandu-cloud}else{go test -race ./internal/toolchain ./internal/storage ./internal/platform ./internal/cloud ./internal/reconcile ./cmd/yandu-cloud}
          if($LASTEXITCODE -ne 0){throw 'Native storage contract failed'}
      - name: Build full native package
        run: python release/build-native-storage.py --components .local/native-components
      - uses: actions/upload-artifact@v4
        with:
          name: storage-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/artifacts/native
            .local/mp4-acceptance/*report.json
# Hosted Windows Server contracts do not replace Windows 11 service/ACL/lifecycle acceptance.
# Neither matrix job asserts production installation, reboot, logout, suspend or public-network acceptance.
